<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="helixGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5A0" />
      <stop offset="50%" stop-color="#FFE14D" />
      <stop offset="100%" stop-color="#E5A800" />
    </linearGradient>
    <linearGradient id="helixPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="200" height="200" rx="44" fill="#0A0A0E" />
  <rect x="1" y="1" width="198" height="198" rx="43" stroke="rgba(255,225,77,0.15)" stroke-width="2" />
  
  <!-- Intertwined Helix Spirals -->
  <g filter="url(#glow)">
    <!-- Primary Helix Curve -->
    <path d="M50 145 C65 160 85 155 100 135 C115 115 115 85 100 65 C85 45 65 40 50 55 C35 70 35 100 50 120 C65 140 100 155 125 140 C145 128 160 105 155 80 C150 55 130 40 105 50" 
          stroke="url(#helixGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Secondary Interlocking Strands -->
    <circle cx="100" cy="100" r="14" fill="#FFE14D" />
    <circle cx="65" cy="70" r="8" fill="#FFF5A0" />
    <circle cx="135" cy="130" r="8" fill="#E5A800" />
    <circle cx="60" cy="130" r="6" fill="#8B5CF6" />
    <circle cx="140" cy="70" r="6" fill="#EC4899" />
  </g>
</svg>
